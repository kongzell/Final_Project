services:
  - type: web
    name: 3work
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production

      # Neon: Dashboard > Connection string (เลือกแบบ pooled)
      # asyncpg ไม่รู้จัก ?sslmode= แต่แอปถอดให้เองใน app/db.py แล้ว วางมาทั้งเส้นได้เลย
      - key: DATABASE_URL
        sync: false

      # ต้องตรงกับโดเมนที่ Render ออกให้ และตรงกับ OAuth App บน GitHub เป๊ะ ๆ
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

      # Render สุ่มให้เอง ไม่ต้องคิดเองและไม่มีใครเห็นค่า
      - key: SESSION_SECRET
        generateValue: true
      # ใช้เข้ารหัส github_token ที่เก็บในฐานข้อมูล
      - key: TOKEN_SECRET
        generateValue: true

      # โหมดข้อมูลตัวอย่างของ AI ต้องปิดบน production
      - key: AI_MOCK
        value: "false"

      # ปิดเป็น "false" เมื่อไม่อยากให้ใครก็ได้สมัครบัญชีเอง
      - key: ALLOW_SIGNUP
        value: "true"

      # โดเมนเดียวกับ frontend อยู่แล้ว ไม่ต้องเปิด CORS ให้ใคร
      - key: CORS_ORIGIN
        sync: false

      # แจ้งเตือนทางอีเมล — ไม่ตั้งก็ deploy ได้ แค่ไม่มีอีเมลส่งออก
      # ใช้ Brevo ผ่าน HTTPS เพราะ Render บล็อกพอร์ต SMTP ขาออก
      - key: BREVO_API_KEY
        sync: false
      # ต้องเป็นอีเมลที่ยืนยันไว้ใน Brevo แล้ว
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # ใช้ทำลิงก์ในอีเมล ต้องเป็น URL ของ Render
      - key: APP_URL
        sync: false
